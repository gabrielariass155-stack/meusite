<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página de confirmação do ebook Império Digital do Zero.">
  <title>Obrigado pela compra | Império Digital do Zero</title>
  <style>
    :root {
      --bg: #05080d;
      --panel: #0f1824;
      --text: #f3f7fb;
      --muted: #a8b8c8;
      --cyan: #12dccd;
      --gold: #e4ce63;
      --line: rgba(255, 255, 255, 0.12);
      --radius: 8px;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 32px 18px;
      background:
        linear-gradient(105deg, rgba(18, 220, 205, 0.11), transparent 42%),
        linear-gradient(180deg, #07101a 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .card {
      width: calc(100vw - 36px);
      max-width: 620px;
      padding: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(15, 24, 36, 0.92);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--cyan), var(--gold));
      color: #061015;
      font-size: 1.45rem;
      font-weight: 950;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--cyan);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 3rem;
      line-height: 1.05;
      letter-spacing: 0;
      overflow-wrap: break-word;
    }

    p {
      margin: 0;
      color: var(--muted);
      overflow-wrap: break-word;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 28px;
    }

    .button,
    .link {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      font-weight: 900;
      text-decoration: none;
    }

    .button {
      background: linear-gradient(135deg, var(--cyan), var(--gold));
      color: #061015;
    }

    .link {
      border: 1px solid var(--line);
      color: var(--text);
    }

    @media (max-width: 640px) {
      body {
        justify-items: start;
      }

      .card {
        width: calc(100vw - 36px);
        max-width: 354px;
        padding: 28px 20px;
      }

      h1 {
        font-size: 1.9rem;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">✓</div>
    <p class="eyebrow">Compra confirmada</p>
    <h1>Obrigado pela sua<br>compra.</h1>
    <p>Seu acesso ao ebook deve aparecer na Kiwify e no e-mail usado na compra. Mantemos o PDF fora desta página pública para proteger o produto.</p>
    <div class="actions">
      <a class="button" href="https://pay.kiwify.com.br/acG8KgP">Ver acesso na Kiwify</a>
      <a class="link" href="index.html">Voltar para a página principal</a>
    </div>
  </main>
</body>
</html>
